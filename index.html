<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="반 고흐의 그림 세 점 속을 360도로 둘러보며 단서를 모으는 중학생용 3D 미술 방탈출">
<title>고흐의 잠긴 아틀리에</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: full-bleed WebGL painting-room, thin gold HUD on the edges, letters open as paper cards. Single dark look on purpose (immersive gallery). */
:root{
  --night:#0a0f24; --ink:#f4ecd6; --muted:#c3bdd3; --gold:#f2c94c; --ochre:#d9932b;
  --paper:#efe3c2; --paper-ink:#2b2340; --paper-line:#c9b27a; --ok:#a8dc8f; --bad:#ff9a8a;
  --panel:rgba(10,15,36,.84); --line:rgba(242,201,76,.4);
  --display:'Gowun Batang','Nanum Myeongjo','AppleMyungjo',serif;
  --ui:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --hand:'Nanum Pen Script','Gowun Dodum',cursive;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(4,6,16,.55) 100%)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* HUD */
.hud{position:fixed;z-index:5}
#hudTL{top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;max-width:55vw}
.roomNo{font-size:12px;letter-spacing:.2em;color:var(--gold)}
.roomName{font-family:var(--display);font-size:clamp(20px,2.6vw,28px);font-weight:700;text-shadow:0 2px 14px rgba(0,0,0,.7);line-height:1.2}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{min-width:36px;height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;cursor:pointer}
.tab[aria-current="true"]{background:var(--gold);color:#241a06;border-color:var(--gold)}
.tab:disabled{opacity:.35;cursor:default}
.tab.done::after{content:" ✓"}
#hudTR{top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
#timer{cursor:default;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#hudB{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(660px,calc(100vw - 32px));display:flex;flex-direction:column;align-items:center;gap:10px}
#guide{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 18px;font-size:15px;line-height:1.55;text-align:center;text-wrap:balance}
#nextBtn{min-height:46px;padding:0 22px;border-radius:999px;border:none;background:var(--gold);color:#241a06;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 0 24px rgba(242,201,76,.45);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 40px rgba(242,201,76,.8)}}
#toast{position:fixed;z-index:15;left:50%;top:22%;transform:translate(-50%,0);background:rgba(10,15,36,.9);border:1px solid var(--line);border-radius:12px;padding:10px 18px;font-size:15px;max-width:calc(100vw - 32px);text-align:center;pointer-events:none;transition:opacity .35s, transform .35s}
#toast.off{opacity:0;transform:translate(-50%,8px)}

/* fade */
#fade{position:fixed;inset:0;z-index:30;background:#05070f;opacity:0;pointer-events:none;transition:opacity .6s ease}
#fade.on{opacity:1;pointer-events:auto}

/* start screen */
#start{position:fixed;inset:0;z-index:25;display:flex;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(90deg,rgba(6,9,24,.88) 0%,rgba(6,9,24,.6) 45%,rgba(6,9,24,0) 80%)}
.startBox{max-width:520px;display:flex;flex-direction:column;gap:16px;padding-left:clamp(0px,5vw,64px);padding-block:24px}
.eyebrow{font-size:13px;letter-spacing:.24em;color:var(--gold)}
.startBox h1{font-family:var(--display);font-size:clamp(36px,6vw,64px);line-height:1.08;margin:0;font-weight:700;text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.startBox h1 em{font-style:normal;color:var(--gold)}
.story{font-family:var(--display);font-size:17px;line-height:1.75;margin:0;color:#e9e1cc;max-width:34em}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.field input{font:inherit;font-size:18px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-width:320px;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:48px;padding:0 24px;border-radius:999px;border:none;background:var(--gold);color:#241a06;font-weight:700;font-size:17px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.small{min-height:40px;font-size:15px;padding:0 18px}
.note{font-size:13px;color:var(--muted);line-height:1.6}

/* modal */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(4,6,16,.5);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{width:min(580px,100%);max-height:calc(100dvh - 48px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 24px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(6px);animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.card h2{font-family:var(--display);font-size:24px;margin:0 0 4px;text-wrap:balance}
.card .sub{font-size:13px;letter-spacing:.14em;color:var(--gold);margin-bottom:12px}
.card p{line-height:1.7;margin:8px 0;font-size:16px}
.card .task{border-left:3px solid var(--gold);padding:8px 12px;background:rgba(242,201,76,.08);border-radius:0 10px 10px 0}
.card ul{margin:8px 0;padding-left:20px;line-height:1.7}
.card.paper{background:var(--paper);color:var(--paper-ink);border-color:var(--paper-line);backdrop-filter:none;
  background-image:repeating-linear-gradient(transparent 0 37px,rgba(120,90,40,.18) 37px 38px)}
.card.paper .sub{color:#8a5a1c}
.hand{font-family:var(--hand);font-size:28px;line-height:1.36}
.src{font-size:12px;color:#6b5a3a;margin-top:6px}
.btnRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}
.fact{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;background:rgba(255,255,255,.05);border-radius:12px;padding:12px 14px;margin:10px 0}
.fact dt{color:var(--gold)}
.fact dd{margin:0}
.timeline{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.timeline li{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:baseline}
.timeline b{font-family:var(--display);color:var(--gold);font-size:18px;font-variant-numeric:tabular-nums}
.timeline span{font-size:14px;line-height:1.55}
/* color wheel */
.wheel{position:relative;width:min(280px,72vw);aspect-ratio:1;margin:12px auto}
.wheel .center{position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 0 30px currentColor;display:grid;place-items:center;font-size:13px;color:#1a1408;font-weight:700}
.wheel button{position:absolute;width:26%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.25);cursor:pointer;transform:translate(-50%,-50%);font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.wheel button:hover{border-color:#fff}
.wheel button.wrong{animation:shake .4s;border-color:var(--bad)}
/* lock */
.lock{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.dial{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.dial label{font-size:13px;color:var(--muted);text-align:center;line-height:1.35;min-height:2.7em}
.dial .ctl{display:flex;align-items:center;gap:6px}
.dial input{width:2.4em;text-align:center;font-family:var(--display);font-size:32px;background:transparent;border:none;color:var(--ink);font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text}
.dial button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.25);cursor:pointer;font-size:18px}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.hints{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.hints div{background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;line-height:1.6}
.big{font-family:var(--display);font-size:clamp(32px,5vw,44px);margin:4px 0;color:var(--gold)}
@media (max-width:560px){
  #hudTL{max-width:60vw}
  .lock{gap:6px}
  .dial input{font-size:26px}
  .card{padding:20px 16px 16px}
}
@media (prefers-reduced-motion:reduce){#nextBtn{animation:none}.card{animation:none}}
</style>
</head>
<body>

<canvas id="gl" aria-label="고흐 그림 속 3D 공간. 끌어서 둘러보고 눌러서 조사합니다."></canvas>
<div id="vig"></div>

<div class="hud" id="hudTL" hidden>
  <div class="roomNo" id="roomNo">방 1 / 3</div>
  <div class="roomName" id="roomName">별이 빛나는 밤</div>
  <div class="tabs" id="tabs"></div>
</div>
<div class="hud" id="hudTR" hidden>
  <span class="chip" id="timer" aria-label="걸린 시간">00:00</span>
  <button class="chip" id="hintBtn" type="button">힌트</button>
  <button class="chip" id="soundBtn" type="button" aria-pressed="true">소리 켬</button>
</div>
<div class="hud" id="hudB" hidden>
  <button id="nextBtn" type="button" hidden>다음 방으로</button>
  <div id="guide"></div>
</div>
<div id="toast" class="off" role="status"></div>

<div id="start">
  <div class="startBox">
    <div class="eyebrow">미술 방탈출 · 빈센트 반 고흐</div>
    <h1>고흐의<br><em>잠긴</em> 아틀리에</h1>
    <p class="story">몰입형 미술관에 들어선 순간 문이 닫히고, 벽과 천장의 그림이 살아 움직이기 시작했어요. 고흐의 그림 세 점 속을 지나며 단서를 모으고, 마지막 문의 자물쇠를 열어 탈출하세요.</p>
    <label class="field" for="team">모둠 이름
      <input id="team" maxlength="12" placeholder="예: 해바라기 모둠" autocomplete="off">
    </label>
    <div class="row">
      <button class="btn" id="startBtn" type="button">탈출 시작</button>
      <button class="btn ghost" id="resumeBtn" type="button" hidden>이어 하기</button>
    </div>
    <div class="note">화면을 끌어서 360도로 둘러보고, 빛나는 것을 눌러 조사해요.<br>태블릿 가로 화면 · 약 15~20분 · 소리를 켜면 더 좋아요.</div>
  </div>
</div>

<div id="modal" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const touch=matchMedia('(pointer: coarse)').matches;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrapA=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a};
const C=h=>{const c=new THREE.Color(h);return [c.r,c.g,c.b]};
function srand(seed){let s=(seed*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
const sph=(r,u,v)=>new THREE.Vector3(r*Math.cos(v)*Math.sin(u),r*Math.sin(v),-r*Math.cos(v)*Math.cos(u));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- state ---------------- */
const KEY='gogh-escape-v1';
const ANSWER=[11,15,2];
function freshState(){return {team:'',started:false,room:0,elapsed:0,hints:0,hintIdx:[0,0,0],visited:[true,false,false],intro:[false,false,false],
  r1:{stars:[],done:false},r2:{done:{},complete:false},r3:{solved:false},escaped:false}}
let S=freshState();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function loadSaved(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.started&&!s.escaped)return s}catch(e){}return null}

/* ---------------- renderer ---------------- */
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,powerPreference:'high-performance'})}
catch(e){document.body.innerHTML='<p style="padding:40px;font-size:18px">이 기기에서는 3D 화면(WebGL)을 열 수 없어요. 다른 브라우저나 기기로 열어 주세요.</p>';return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
const camera=new THREE.PerspectiveCamera(68,1,0.05,600);
camera.rotation.order='YXZ';
let pxScale=600;
const strokeMats=[];
function updFov(){camera.updateProjectionMatrix();pxScale=renderer.getPixelRatio()*innerHeight/(2*Math.tan(camera.fov*Math.PI/360));strokeMats.forEach(m=>m.uniforms.uPx.value=pxScale)}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;updFov()}
addEventListener('resize',resize);resize();

/* ---------------- canvas textures ---------------- */
function canvasTex(w,h,draw){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(cv);t.anisotropy=4;return t}
function brush(x,x1,y1,x2,y2,col,w,al){x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.globalAlpha=al==null?1:al;x.beginPath();x.moveTo(x1,y1);x.quadraticCurveTo((x1+x2)/2+rand(-w,w),(y1+y2)/2+rand(-w,w),x2,y2);x.stroke();x.globalAlpha=1}
function brushFill(x,w,h,base,cols,n,len,ang,jit,lw){x.fillStyle=base;x.fillRect(0,0,w,h);for(let i=0;i<n;i++){const px=Math.random()*w,py=Math.random()*h,a=ang+rand(-jit,jit),l=len*rand(.6,1.3);brush(x,px,py,px+Math.cos(a)*l,py+Math.sin(a)*l,pick(cols),lw*rand(.6,1.3),rand(.35,.85))}}
function paintTex(hex,o){o=o||{};const base=new THREE.Color(hex);const cols=[-.09,-.045,.045,.09].map(d=>'#'+base.clone().offsetHSL(rand(-.015,.015),0,d).getHexString());const sz=o.size||128;
  const t=canvasTex(sz,sz,(x,w,h)=>brushFill(x,w,h,hex,cols,o.n||170,o.len||sz*.2,o.ang||0,o.jit==null?.7:o.jit,o.lw||sz*.055));if(o.rep){t.wrapS=t.wrapT=THREE.RepeatWrapping}return t}

const glowTex=canvasTex(128,128,(x)=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128)});
const starTex=canvasTex(256,256,(x)=>{const c=128;const g=x.createRadialGradient(c,c,0,c,c,58);g.addColorStop(0,'rgba(255,253,230,1)');g.addColorStop(.35,'rgba(250,226,120,.95)');g.addColorStop(1,'rgba(240,200,80,0)');x.fillStyle=g;x.beginPath();x.arc(c,c,58,0,TAU);x.fill();
  [[40,'#fff3b0',8],[66,'#f2cf5b',7],[92,'#efe6a8',5],[116,'#cdd9ec',4]].forEach(([r,col,lw])=>{for(let k=0;k<22;k++){const a0=k/22*TAU+rand(0,.1),a1=a0+TAU/22*rand(.5,.85);x.strokeStyle=col;x.globalAlpha=rand(.45,.9);x.lineWidth=lw*rand(.7,1.2);x.lineCap='round';x.beginPath();x.arc(c,c,r+rand(-3,3),a0,a1);x.stroke()}});x.globalAlpha=1});
const moonTex=canvasTex(256,256,(x)=>{const c=128;[[96,'#f2b84a',7],[118,'#e9c97a',5]].forEach(([r,col,lw])=>{for(let k=0;k<20;k++){const a0=k/20*TAU,a1=a0+TAU/20*rand(.5,.85);x.strokeStyle=col;x.globalAlpha=rand(.5,.9);x.lineWidth=lw;x.lineCap='round';x.beginPath();x.arc(c,c,r,a0,a1);x.stroke()}});
  x.globalAlpha=1;const cv=document.createElement('canvas');cv.width=cv.height=256;const y=cv.getContext('2d');y.fillStyle='#f6c443';y.beginPath();y.arc(c,c,70,0,TAU);y.fill();y.globalCompositeOperation='destination-out';y.beginPath();y.arc(c+38,c-26,62,0,TAU);y.fill();x.drawImage(cv,0,0)});
const envTex=canvasTex(256,176,(x,w,h)=>{x.fillStyle='#efe3c2';x.fillRect(4,4,w-8,h-8);x.strokeStyle='#b89b62';x.lineWidth=3;x.strokeRect(4,4,w-8,h-8);x.beginPath();x.moveTo(6,8);x.lineTo(w/2,h*.58);x.lineTo(w-6,8);x.stroke();x.fillStyle='#a8322a';x.beginPath();x.arc(w/2,h*.58,22,0,TAU);x.fill();x.fillStyle='#f3d9a0';x.font='bold 24px Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillText('V',w/2,h*.58+1)});
function badgeTex(n){return canvasTex(128,128,(x)=>{x.fillStyle='#f2c94c';x.beginPath();x.arc(64,64,54,0,TAU);x.fill();x.strokeStyle='#241a06';x.lineWidth=5;x.stroke();x.fillStyle='#241a06';x.font='bold 64px Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillText(String(n),64,68)})}
function textSprite(txt,h){const px=48,font=`${px}px 'Gowun Dodum',sans-serif`;const m=document.createElement('canvas').getContext('2d');m.font=font;const w=Math.ceil(m.measureText(txt).width)+40,H=px+30;
  const t=canvasTex(w,H,(x)=>{x.fillStyle='rgba(10,15,36,.72)';const r=H/2;x.beginPath();x.moveTo(r,0);x.lineTo(w-r,0);x.arc(w-r,r,r,-Math.PI/2,Math.PI/2);x.lineTo(r,H);x.arc(r,r,r,Math.PI/2,Math.PI*1.5);x.fill();x.fillStyle='#f4ecd6';x.font=font;x.textAlign='center';x.textBaseline='middle';x.fillText(txt,w/2,H/2+2)});
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));s.scale.set(h*w/H,h,1);s.renderOrder=6;return s}
function glowSprite(color,scale,op){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color,transparent:true,opacity:op==null?.6:op,depthWrite:false,blending:THREE.AdditiveBlending}));s.scale.setScalar(scale);return s}
const hitGeo=new THREE.SphereGeometry(1,10,8);
const hitMat=new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false});
function hitProxy(pos,r,data){const m=new THREE.Mesh(hitGeo,hitMat);m.position.copy(pos);m.scale.setScalar(r);m.userData=data;return m}

/* ---------------- brush-stroke particles (the Arte-museum look) ---------------- */

  card.querySelectorAll('.dial input').forEach(inp=>inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,'').slice(0,2);S.lockVals=read()});
  function tryLock(){const v=read();S.lockVals=v;save();if(v.every((x,i)=>x===ANSWER[i])){closeModal();escape()}else{const lk=card.querySelector('#lock');lk.classList.remove('shake');void lk.offsetWidth;lk.classList.add('shake');
    const right=v.filter((x,i)=>x===ANSWER[i]).length;card.querySelector('#lfb').textContent=`철컥, 열리지 않아요. 맞은 숫자는 ${right}개예요. 위쪽 방 버튼으로 앞의 방에 다시 다녀올 수 있어요.`;auBuzz()}}}
const HINTS=[
 ['하늘은 360도예요. 화면을 옆으로 계속 끌어서 등 뒤의 하늘까지 살펴보세요.','별은 희미하게 깜빡이는 노란 점이에요. 사이프러스 나무 꼭대기 위쪽과 달 양옆에도 있어요.','달은 별이 아니에요. 지평선 바로 위 낮은 곳도 잘 보세요. 별은 모두 11개예요.'],
 ['물감 방울은 정면이 아니라 왼쪽, 오른쪽, 등 뒤에 하나씩 떠 있어요.','색상환에서 정반대에 있는 색이 보색이에요. 빨강↔초록, 노랑↔보라, 주황↔파랑.','해바라기는 줄을 나눠 세면 쉬워요. 아래 줄, 가운데 줄, 위 줄, 그리고 양옆과 맨 꼭대기도 잊지 마세요.'],
 ['어두운 갈색으로 그린 그림은 고흐가 화가가 된 지 얼마 안 된 네덜란드 시절의 그림이에요.','앞의 두 방을 떠올려 보세요. 해바라기는 1888년, 별이 빛나는 밤은 1889년이에요.','까마귀가 나는 밀밭은 고흐 생애 마지막 해(1890)의 그림이에요. 자물쇠의 세 번째 숫자는 이 방의 의자 수예요. 침대 근처와 탁자 근처를 잘 보세요.']];
function hintCard(){const r=S.room,shown=S.hintIdx[r];
  const list=()=>HINTS[r].slice(0,S.hintIdx[r]).map((h,i)=>`<div><b>힌트 ${i+1}</b> · ${esc(h)}</div>`).join('')||'<div>아직 본 힌트가 없어요.</div>';
  const btns=[['닫기',closeModal,'ghost']];if(shown<HINTS[r].length)btns.push([shown?'다음 힌트 보기':'힌트 보기',()=>{S.hintIdx[r]++;S.hints++;save();renderHUD();hintCard()}]);
  openCard(`<div class="sub">${ROOMDEF[r].no} · 힌트</div><h2>${ROOMDEF[r].title}</h2><div class="hints">${list()}</div><p class="note">힌트를 볼 때마다 기록에 남아요. 지금까지 ${S.hints}번.</p>`,btns)}

/* ---------------- rooms & navigation ---------------- */
const ROOMDEF=[{no:'방 1 / 3',title:'별이 빛나는 밤',build:buildRoom1},{no:'방 2 / 3',title:'해바라기',build:buildRoom2},{no:'방 3 / 3',title:'아를의 침실',build:buildRoom3}];
const built=[];let cur=null;
function getRoom(i){if(!built[i]){built[i]=ROOMDEF[i].build();built[i].restore()}return built[i]}
const look={yaw:0,pitch:0,vy:0,vp:0,drag:false};
function enterRoom(i){S.room=i;S.visited[i]=true;cur=getRoom(i);camera.position.set(...cur.camPos);look.yaw=cur.yaw0;look.pitch=cur.pitch0;look.vy=look.vp=0;camera.fov=68;updFov();auPad(PADS[i]);renderHUD();save()}
function fade(mid){const f=$('fade');f.classList.add('on');setTimeout(()=>{mid();requestAnimationFrame(()=>setTimeout(()=>f.classList.remove('on'),60))},620)}
function goRoom(i){if(modalOpen)closeModal();fade(()=>{enterRoom(i);if(!S.intro[i]){S.intro[i]=true;save();setTimeout(()=>cur.intro(),700)}})}

/* ---------------- HUD ---------------- */
let toastT=0;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('off');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('off'),2600)}
function renderGuide(){if(cur&&S.started&&!S.escaped)$('guide').innerHTML=cur.guide()}
function renderHUD(){const playing=S.started&&!S.escaped;['hudTL','hudTR','hudB'].forEach(id=>$(id).hidden=!playing);if(!playing)return;
  $('roomNo').textContent=ROOMDEF[S.room].no;$('roomName').textContent=ROOMDEF[S.room].title;
  const solved=[S.r1.done,S.r2.complete,S.r3.solved];
  $('tabs').innerHTML=ROOMDEF.map((r,i)=>`<button class="tab${solved[i]?' done':''}" type="button" data-r="${i}" aria-current="${i===S.room}" ${S.visited[i]?'':'disabled'} aria-label="${r.title}">${i+1}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{const r=+b.dataset.r;if(r!==S.room)goRoom(r)});
  $('hintBtn').textContent=S.hints?`힌트 · ${S.hints}`:'힌트';
  const nx=$('nextBtn');const showNext=S.room<2&&cur&&cur.solved();nx.hidden=!showNext;if(showNext)nx.textContent=S.visited[S.room+1]?`방 ${S.room+2}로 돌아가기`:'다음 방으로';
  renderGuide()}
$('nextBtn').onclick=()=>goRoom(S.room+1);
$('hintBtn').onclick=()=>{if(!modalOpen)hintCard()};
$('soundBtn').onclick=()=>{AU.on=!AU.on;auInit();if(AU.master)AU.master.gain.setTargetAtTime(AU.on?.9:0,AU.ctx.currentTime,.2);$('soundBtn').textContent=AU.on?'소리 켬':'소리 끔';$('soundBtn').setAttribute('aria-pressed',String(AU.on))};
const fmt=s=>{s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

/* ---------------- ending ---------------- */
function escape(){S.escaped=true;save();auArp(523.25);setTimeout(()=>auArp(659.25),600);
  fade(()=>{cur=getRoom(0);cur.stars.forEach((s,i)=>{if(!s.awake){s.awake=true}});cur.refreshV();cur.stars.forEach(s=>{s.sp.material.opacity=1});cur.sky.recolor(1);cur.sky.speed=2.4;
    camera.position.set(0,0,0);look.yaw=0;look.pitch=.55;camera.fov=74;updFov();auPad(PADS[0]);renderHUD();
    setTimeout(()=>openCard(`<div class="sub">탈출 성공</div><h2>${esc(S.team||'우리')} 모둠, 아틀리에를 빠져나왔어요!</h2>
     <dl class="fact"><dt>걸린 시간</dt><dd>${fmt(S.elapsed)}</dd><dt>힌트</dt><dd>${S.hints}번</dd><dt>자물쇠</dt><dd>별 11 · 해바라기 15 · 의자 2</dd></dl>
     <p><b>오늘 만난 고흐의 10년</b></p><ol class="timeline">${WORKS.map(w=>`<li><b>${w.year}</b><span>${esc(w.title)} · ${esc(w.place)}</span></li>`).join('')}</ol>
     <p class="note">이 화면을 선생님께 보여 주세요. 활동지에 가장 마음에 든 방과 그 이유를 적어 보세요.</p>`,[['처음부터 다시',()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()},'ghost'],['밤하늘 감상하기',closeModal]]),900)})}

/* ---------------- input: drag to look, tap to inspect ---------------- */
const cv=$('gl');const ptrs=new Map();let down=null,pinch=null,lastMove=0;const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
const pd=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
cv.addEventListener('pointerdown',e=>{if(modalOpen)return;try{cv.setPointerCapture(e.pointerId)}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){down={x:e.clientX,y:e.clientY,t:performance.now(),moved:0};look.drag=true;look.vy=look.vp=0;cv.classList.add('drag')}else if(ptrs.size===2){pinch={d:pd(),fov:camera.fov};down=null}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);
  if(!p){hover(e);return}const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){const k=camera.fov*Math.PI/180/innerHeight*1.1;look.yaw+=dx*k;look.pitch+=dy*k;const now=performance.now(),dtm=Math.max(8,now-lastMove)/1000;lastMove=now;look.vy=look.vy*.6+dx*k/dtm*.4;look.vp=look.vp*.6+dy*k/dtm*.4;if(down)down.moved+=Math.abs(dx)+Math.abs(dy)}
  else if(ptrs.size===2&&pinch){camera.fov=clamp(pinch.fov*pinch.d/pd(),40,80);updFov()}});
function up(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(ptrs.size===0){look.drag=false;cv.classList.remove('drag');if(performance.now()-lastMove>90){look.vy=look.vp=0}
    if(down&&down.moved<10&&performance.now()-down.t<600&&e.type==='pointerup')tap(e.clientX,e.clientY);down=null}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();camera.fov=clamp(camera.fov+e.deltaY*.03,40,80);updFov()},{passive:false});
function castAt(x,y){if(!cur)return null;ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const h=ray.intersectObjects(cur.hits,false);return h.length?h[0].object.userData:null}
function tap(x,y){if(!S.started||S.escaped||modalOpen)return;const d=castAt(x,y);if(d)cur.tap(d)}
let hovT=0;function hover(e){if(!S.started||S.escaped||touch)return;const now=performance.now();if(now-hovT<80)return;hovT=now;cv.style.cursor=castAt(e.clientX,e.clientY)?'pointer':''}
addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen){closeModal();return}if(modalOpen||!S.started)return;const s=.08;
  if(e.key==='ArrowLeft')look.yaw+=s;else if(e.key==='ArrowRight')look.yaw-=s;else if(e.key==='ArrowUp')look.pitch+=s;else if(e.key==='ArrowDown')look.pitch-=s});

/* ---------------- start / resume ---------------- */
function begin(resume){auInit();const st=$('start');st.style.transition='opacity .8s';st.style.opacity='0';setTimeout(()=>st.hidden=true,800);
  if(!resume){const team=$('team').value.trim();S=freshState();S.team=team;built.length=0}
  S.started=true;save();
  if(resume){fade(()=>{enterRoom(S.room)})}else{enterRoom(0);S.intro[0]=true;save();setTimeout(()=>cur.intro(),700)}}
$('startBtn').onclick=()=>begin(false);
$('team').addEventListener('keydown',e=>{if(e.key==='Enter')begin(false)});
$('resumeBtn').onclick=()=>{const s=loadSaved();if(s){S=Object.assign(freshState(),s);built.length=0;$('team').value=S.team;begin(true)}};

/* ---------------- loop ---------------- */
let last=performance.now(),timerShown=-1;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  if(!look.drag){look.yaw+=look.vy*dt;look.pitch+=look.vp*dt;const dec=Math.pow(.03,dt);look.vy*=dec;look.vp*=dec}
  if(!S.started||S.escaped)look.yaw+=(S.escaped?.035:.025)*dt;
  if(cur){look.pitch=clamp(look.pitch,cur.pmin,cur.pmax);camera.rotation.set(look.pitch,look.yaw,0);cur.update(t,dt)}
  runTweens(now);
  if(S.started&&!S.escaped&&!document.hidden){S.elapsed+=dt;const s=Math.floor(S.elapsed);if(s!==timerShown){timerShown=s;$('timer').textContent=fmt(s);if(s%10===0)save()}}
  if(cur)renderer.render(cur.scene,camera);requestAnimationFrame(frame)}

function boot(data){
  if(data&&data.S){S=Object.assign(freshState(),data.S)}
  const saved=loadSaved();if(saved&&!(data&&data.S))$('resumeBtn').hidden=false;
  if(S.started&&!S.escaped){$('start').hidden=true;enterRoom(S.room)}
  else{cur=getRoom(0);camera.position.set(0,0,0);look.yaw=.2;look.pitch=.42}
  requestAnimationFrame(frame)}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S}));
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
</body>
</html>
